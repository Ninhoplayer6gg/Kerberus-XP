name: Kerberus XP 6.1.2 - Android ARM64 (v11 hardened)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kerberus XP 6.1.2 Hardened R2 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      NDK_VERSION: 23.2.8568313
      ANDROID_API: "23"
      SOURCE_ZIP: Kerberus-XP-6.1.2-Hardened-R2-Source.zip
      PROJECT_DIR: ${{ github.workspace }}/_kerberus/project

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Hardened R2 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || {
            echo "ERRO: coloque $SOURCE_ZIP na raiz do repositorio."
            exit 1
          }
          unzip -t "$SOURCE_ZIP" >/dev/null

      - name: Extract Kerberus Hardened R2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/_kerberus"
          mkdir -p "$GITHUB_WORKSPACE/_kerberus"
          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/_kerberus"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/KERBERUS-6.1.2-HARDENED-R2.md"
          grep -q 'versionName "6.1.2-landscape-integration"' "$PROJECT_DIR/app/build.gradle"

      - name: Source preflight and host tests
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          chmod +x scripts/validate-host.sh scripts/ci-source-preflight.sh scripts/audit-apk.sh
          bash scripts/ci-source-preflight.sh | tee "$GITHUB_WORKSPACE/source-preflight.log"

      - name: Set up JDK 17 for Android tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER" || { echo "ERRO: sdkmanager nao encontrado"; exit 1; }

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_RC=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_RC" -ne 0 ]; then
            echo "ERRO: sdkmanager --licenses retornou $LICENSE_RC"
            exit "$LICENSE_RC"
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;${NDK_VERSION}"

          test -x "$SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential cmake file gawk git gperf \
            libtool pkg-config python3 ruby unzip wget xxd

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$TC/bin/aarch64-linux-android${ANDROID_API}-clang"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "ARCH=linux-x86_64" >> "$GITHUB_ENV"
          echo "$TC/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kerberus-r2-gradle-${{ runner.os }}-${{ hashFiles('Kerberus-XP-6.1.2-Hardened-R2-Source.zip') }}
          restore-keys: |
            kerberus-r2-gradle-${{ runner.os }}-

      - name: Download JNI dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail
          chmod +x get_deps.sh
          ./get_deps.sh | tee "$GITHUB_WORKSPACE/get-deps.log"
          git -C openssl describe --tags --always || true
          git -C pixman describe --tags --always || true
          git -C openal describe --tags --always || true

      - name: Prepare cross-build compiler launchers
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail
          mkdir -p .kerberus-termux
          cat > .kerberus-termux/c-launcher.sh <<'EOF'
          #!/usr/bin/env bash
          unset CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH LIBRARY_PATH SDKROOT 2>/dev/null || true
          exec "$@"
          EOF
          cp .kerberus-termux/c-launcher.sh .kerberus-termux/cxx-launcher.sh
          chmod +x .kerberus-termux/*-launcher.sh

      - name: Build modern native dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          unset CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH LIBRARY_PATH SDKROOT 2>/dev/null || true
          : > "$GITHUB_WORKSPACE/native-modern.log"

          for target in cpufeatures pixman iconv openal openssl ruby; do
            echo "========== modern target: $target ==========" | tee -a "$GITHUB_WORKSPACE/native-modern.log"
            HOST=aarch64-linux-android \
            TARGET=aarch64-linux-android \
            ABI=arm64-v8a \
            NPROC="$(nproc)" \
            make -j1 "$target" 2>&1 | tee -a "$GITHUB_WORKSPACE/native-modern.log"
          done

          MODERN="$PWD/build-arm64-v8a"
          for f in \
            "$MODERN/lib/libpixman-1.a" \
            "$MODERN/lib/libiconv.a" \
            "$MODERN/lib/libopenal.so" \
            "$MODERN/lib/libssl.a" \
            "$MODERN/lib/libcrypto.a" \
            "$MODERN/lib/libruby.so.3.1.0"; do
            test -s "$f" || { echo "ERRO: dependencia moderna ausente: $f"; exit 1; }
          done

      - name: Validate and stage Ruby 3.1 runtime
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail
          MODERN="$PWD/build-arm64-v8a"

          test -s "$MODERN/lib/libruby.so.3.1.0"
          ln -sfn libruby.so.3.1.0 "$MODERN/lib/libruby.so.3.1"
          ln -sfn libruby.so.3.1.0 "$MODERN/lib/libruby.so"

          test -s "$MODERN/include/ruby-3.1.0/ruby.h"
          test -s "$MODERN/include/ruby-3.1.0/aarch64-linux-android-android/ruby/config.h"
          test -s "$PWD/ruby/ext/zlib/zlib.o" || {
            echo "ERRO: ruby/ext/zlib/zlib.o ausente; mkxp-z31 o vincula estaticamente."
            exit 1
          }

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d "$MODERN/lib/libruby.so.3.1.0" | tee "$GITHUB_WORKSPACE/ruby31-dynamic.txt"

      - name: Build and stage Ruby 1.8 legacy runtime
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail

          PIN_RUBY18="50783b870e31259ed5c91badbd5c8e41f8e56273"
          R18="$PWD/ruby18-src"
          OUT="$PWD/build-arm64-v8a/ruby18"
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TC/bin/aarch64-linux-android${ANDROID_API}-clang"
          AR="$TC/bin/llvm-ar"
          RANLIB="$TC/bin/llvm-ranlib"
          NM="$TC/bin/llvm-nm"

          rm -rf "$R18"
          git clone -q -b ruby_1_8 https://github.com/joiplay/ruby "$R18"
          git -C "$R18" checkout -q "$PIN_RUBY18"

          for name in config.guess config.sub; do
            aux="$(find /usr/share -type f -name "$name" 2>/dev/null | head -1 || true)"
            test -z "$aux" || cp -f "$aux" "$R18/$name"
          done

          # Ruby 1.8 source assumes the old TRUE constant in this host-side generator.
          sed -i 's/=>TRUE/=>true/g' "$R18/mkconfig.rb" || true

          # During a cross-build, target rbconfig.rb is intentionally evaluated by
          # the host Ruby. Keep the normal version guard for the Android runtime,
          # but do not reject the host tool while CROSS_COMPILING is active.
          python3 - "$R18/mkconfig.rb" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '''module RbConfig
            RUBY_VERSION == "#{version}" or
              raise "ruby lib version (#{version}) doesn't match executable version (\\#{RUBY_VERSION})"

          '''
          new = '''module RbConfig
            unless defined?(CROSS_COMPILING)
              RUBY_VERSION == "#{version}" or
                raise "ruby lib version (#{version}) doesn't match executable version (\\#{RUBY_VERSION})"
            end

          '''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif 'unless defined?(CROSS_COMPILING)' not in s:
              raise SystemExit('ERRO: guarda de versao esperado nao encontrado em mkconfig.rb')
          PY

          # Avoid noisy redefinition from the host rbconfig before the official
          # Ruby 1.8 cross helper sets CROSS_COMPILING to the target platform.
          python3 - "$R18/template/fake.rb.in" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = 'class Object\n  CROSS_COMPILING = RUBY_PLATFORM\n'
          new = 'class Object\n  remove_const :CROSS_COMPILING if defined?(CROSS_COMPILING)\n  CROSS_COMPILING = RUBY_PLATFORM\n'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY

          # Android/Bionic has mbrlen; this old Ruby tree calls mblen in CharNext.
          python3 - "$R18/ruby.c" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '''#ifndef CharNext\t\t/* defined as CharNext[AW] on Windows. */
          #define CharNext(p) ((p) + mblen(p, RUBY_MBCHAR_MAXSIZE))
          #endif'''
          new = '''#if defined(__ANDROID__)
          #include <wchar.h>
          static int kerberus_android_mblen(const char *s, size_t n)
          {
              mbstate_t state = {0};
              size_t r = mbrlen(s, n, &state);
              if (r == (size_t)-1 || r == (size_t)-2) return -1;
              return (int)r;
          }
          #define KERBERUS_MBLEN(s,n) kerberus_android_mblen((s),(n))
          #else
          #define KERBERUS_MBLEN(s,n) mblen((s),(n))
          #endif

          #ifndef CharNext\t\t/* defined as CharNext[AW] on Windows. */
          #define CharNext(p) ((p) + KERBERUS_MBLEN(p, RUBY_MBCHAR_MAXSIZE))
          #endif'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif 'KERBERUS_MBLEN' not in s:
              raise SystemExit('ERRO: macro CharNext esperado nao encontrado em ruby.c')
          PY

          cd "$R18"
          autoconf

          RES="$($CC -print-resource-dir)"
          SYSROOT="$TC/sysroot"
          R18INC="-I$R18 -I. -nostdinc -isystem $RES/include -isystem $SYSROOT/usr/include/aarch64-linux-android -isystem $SYSROOT/usr/include"
          R18CFLAGS="-std=gnu89 -O2 -fPIC -fno-stack-protector -fno-strict-aliasing -fwrapv -Wno-implicit-function-declaration -Wno-implicit-int -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-incompatible-function-pointer-types --sysroot=$SYSROOT $R18INC"
          R18LDFLAGS="--sysroot=$SYSROOT -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 -ldl -lm -lz"

          export RUBYOPT="--disable-gems"
          CC="$CC" AR="$AR" RANLIB="$RANLIB" NM="$NM" \
          RUBY="ruby --disable-gems" BASERUBY="ruby --disable-gems" \
          CFLAGS="$R18CFLAGS" CPPFLAGS="$R18INC" LDFLAGS="$R18LDFLAGS" \
          ./configure \
            --host=aarch64-linux-android \
            --build=x86_64-pc-linux-gnu \
            --disable-shared \
            --with-static-linked-ext \
            ac_cv_func_fork=no \
            ac_cv_func_memcmp=yes \
            ac_cv_header_pwd_h=no \
            ac_cv_header_langinfo_h=no

          cat > "$R18/kerberus-host-ruby" <<'EOF'
          #!/usr/bin/env bash
          exec ruby --disable-gems "$@"
          EOF
          chmod +x "$R18/kerberus-host-ruby"

          make -j1 fake
          FAKE_RB="$(find "$R18" -maxdepth 1 -type f -name '*-fake.rb' -print -quit || true)"
          test -n "$FAKE_RB" || { echo "ERRO: make fake nao gerou *-fake.rb"; exit 1; }
          FAKE_MOD="$(basename "$FAKE_RB" .rb)"
          HOST_MINIRUBY="$R18/kerberus-host-ruby -rrbconfig -rfileutils -rerb -I$R18 -r$FAKE_MOD"

          echo "Ruby 1.8 helper: $FAKE_RB"
          "$R18/kerberus-host-ruby" -e 'abort if defined?(Gem); puts "RubyGems disabled: OK"'
          "$R18/kerberus-host-ruby" -rrbconfig -rfileutils -rerb -I"$R18" -r"$FAKE_MOD" -e '
            abort "target version spoof failed" unless RUBY_VERSION == "1.8.8"
            abort "CROSS_COMPILING missing" unless defined?(CROSS_COMPILING)
            abort "FileUtils missing" unless defined?(FileUtils)
            abort "ERB missing" unless defined?(ERB)
            puts "Ruby 1.8 host tools + fake helper: OK"
          '

          : > "$GITHUB_WORKSPACE/ruby18.log"

          # Build generator milestones separately so a failure is easy to locate.
          for target in .rbconfig.time prelude.c libruby-static.a; do
            echo "========== Ruby 1.8 target: $target ==========" | tee -a "$GITHUB_WORKSPACE/ruby18.log"
            set +e
            make -j1 \
              CC="$CC" AR="$AR" RANLIB="$RANLIB" NM="$NM" \
              RUBY="$R18/kerberus-host-ruby" \
              BASERUBY="$R18/kerberus-host-ruby" \
              MINIRUBY="$HOST_MINIRUBY" \
              CFLAGS="$R18CFLAGS" \
              CPPFLAGS="$R18INC" \
              LDFLAGS="$R18LDFLAGS" \
              "$target" 2>&1 | tee -a "$GITHUB_WORKSPACE/ruby18.log"
            RC=${PIPESTATUS[0]}
            set -e
            if [ "$RC" -ne 0 ]; then
              echo "ERRO: Ruby 1.8 target $target falhou com codigo $RC"
              tail -n 220 "$GITHUB_WORKSPACE/ruby18.log" || true
              exit "$RC"
            fi

            if [ "$target" = ".rbconfig.time" ]; then
              "$R18/kerberus-host-ruby" -rrbconfig -rfileutils -rerb -I"$R18" -r"$FAKE_MOD" -I. -e '
                require "./rbconfig"
                abort "target rbconfig version mismatch" unless RbConfig::CONFIG["MAJOR"] == "1"
                puts "Ruby 1.8 cross rbconfig: OK"
              '
            fi
          done

          test -s libruby-static.a || { echo "ERRO: libruby-static.a nao foi gerado"; exit 1; }
          test -s prelude.c || { echo "ERRO: prelude.c nao foi gerado"; exit 1; }

          rm -rf "$OUT"
          mkdir -p "$OUT/lib" "$OUT/include" "$OUT/obj"
          cp -f libruby-static.a "$OUT/lib/libruby18-static.a"
          find . -maxdepth 1 -type f -name '*.h' -exec cp -f {} "$OUT/include/" \;

          for spec in zlib:zlib.c stringio:stringio.c strscan:strscan.c; do
            dir="${spec%%:*}"
            file="${spec#*:}"
            "$CC" $R18CFLAGS -I"$R18" -I"$OUT/include" -DOS_CODE=OS_UNIX \
              -c "$R18/ext/$dir/$file" -o "$OUT/obj/$dir.o"
          done

          "$AR" rcs "$OUT/lib/libruby18-ext.a" "$OUT/obj/"*.o
          "$RANLIB" "$OUT/lib/libruby18-static.a"
          "$RANLIB" "$OUT/lib/libruby18-ext.a"

          "$NM" "$OUT/lib/libruby18-static.a" | grep -q ' ruby_init$'
          for sym in Init_zlib Init_stringio Init_strscan; do
            "$NM" "$OUT/lib/libruby18-ext.a" | grep -q " $sym$" || {
              echo "ERRO: $sym ausente em libruby18-ext.a"
              exit 1
            }
          done

          echo "Ruby 1.8 legacy runtime staged: OK"

      - name: Generate mkxp-z embedded assets
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni/mkxp-z
        run: |
          set -euo pipefail
          chmod +x make_xxd.sh
          ./make_xxd.sh
          test -d xxd/assets
          test -d xxd/shader
          touch binding/binding-mri.cpp binding/binding-util.h

      - name: Native preflight before Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail
          MODERN="$PWD/build-arm64-v8a"
          for f in \
            "$MODERN/lib/libruby.so" \
            "$MODERN/lib/libopenal.so" \
            "$MODERN/ruby18/lib/libruby18-static.a" \
            "$MODERN/ruby18/lib/libruby18-ext.a" \
            "$PWD/ruby/ext/zlib/zlib.o"; do
            test -e "$f" || { echo "ERRO: preflight nativo ausente: $f"; exit 1; }
          done
          test -s "$MODERN/include/ruby-3.1.0/aarch64-linux-android-android/ruby/config.h"
          test -s "$MODERN/ruby18/include/ruby.h"
          echo KERBERUS_NATIVE_PREFLIGHT_OK

      - name: Set up JDK 11 for AGP 7.3.1
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Configure Gradle Android paths
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK_HOME
          EOF
          chmod +x gradlew
          grep -q 'gradle-7.4.2-bin.zip' gradle/wrapper/gradle-wrapper.properties
          java -version
          ./gradlew --version --no-daemon | tee "$GITHUB_WORKSPACE/gradle-version.log"

      - name: Build Kerberus XP debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Collect and audit APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -iname '*debug*.apk' | sort | head -1)"
          test -f "$APK"

          OUT="$GITHUB_WORKSPACE/Kerberus-XP-6.1.2-Hardened-R2-arm64-debug.apk"
          cp -f "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          bash scripts/audit-apk.sh "$OUT" "$READELF" | tee "$GITHUB_WORKSPACE/apk-audit.log"

      - name: Upload Kerberus APK
        uses: actions/upload-artifact@v4
        with:
          name: Kerberus-XP-6.1.2-Hardened-R2-arm64-debug
          path: |
            Kerberus-XP-6.1.2-Hardened-R2-arm64-debug.apk
            Kerberus-XP-6.1.2-Hardened-R2-arm64-debug.apk.sha256
            source-preflight.log
            native-modern.log
            ruby31-dynamic.txt
            ruby18.log
            gradle-version.log
            gradle-build.log
            apk-audit.log
          retention-days: 30
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kerberus-XP-6.1.2-Hardened-R2-failure-logs
          path: |
            source-preflight.log
            get-deps.log
            native-modern.log
            ruby31-dynamic.txt
            ruby18.log
            gradle-version.log
            gradle-build.log
            apk-audit.log
          if-no-files-found: ignore
          retention-days: 14
