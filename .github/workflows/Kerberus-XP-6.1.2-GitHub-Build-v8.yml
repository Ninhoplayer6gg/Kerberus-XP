name: Kerberus XP 6.1.2 - Android ARM64 (v8)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kerberus XP 6.1.2 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      NDK_VERSION: 23.2.8568313
      ANDROID_API: "23"
      SOURCE_ZIP: Kerberus-XP-6.1.2-Landscape-Integration-Source.zip
      PROJECT_DIR: ${{ github.workspace }}/_kerberus/project

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Kerberus source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || {
            echo "ERRO: coloque $SOURCE_ZIP na raiz do repositorio."
            exit 1
          }
          unzip -t "$SOURCE_ZIP" >/dev/null

      - name: Extract Kerberus 6.1.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/_kerberus"
          mkdir -p "$GITHUB_WORKSPACE/_kerberus"
          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/_kerberus"
          test -f "$PROJECT_DIR/app/build.gradle"
          grep -q 'versionName "6.1.2-landscape-integration"' \
            "$PROJECT_DIR/app/build.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          test -n "$SDKMANAGER" || {
            echo "ERRO: sdkmanager nao encontrado"
            exit 1
          }

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_RC=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_RC" -ne 0 ]; then
            echo "ERRO: sdkmanager --licenses retornou $LICENSE_RC"
            exit "$LICENSE_RC"
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;${NDK_VERSION}"

          test -d "$SDK_ROOT/ndk/${NDK_VERSION}"
          test -x \
            "$SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential cmake gawk git \
            libtool pkg-config python3 unzip wget xxd

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -x "$TC/bin/aarch64-linux-android${ANDROID_API}-clang"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "ARCH=linux-x86_64" >> "$GITHUB_ENV"
          echo "$TC/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kerberus-gradle-${{ runner.os }}-${{ hashFiles('Kerberus-XP-6.1.2-Landscape-Integration-Source.zip') }}
          restore-keys: |
            kerberus-gradle-${{ runner.os }}-

      - name: Download JNI dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail
          chmod +x get_deps.sh
          ./get_deps.sh

      - name: Patch GitHub cross-build environment
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail

          mkdir -p .kerberus-termux

          cat > .kerberus-termux/c-launcher.sh <<'EOF'
          #!/usr/bin/env bash
          exec "$@"
          EOF

          cp .kerberus-termux/c-launcher.sh \
            .kerberus-termux/cxx-launcher.sh
          chmod +x .kerberus-termux/*-launcher.sh

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Makefile")
          s = p.read_text()

          old = """OPENAL_CONFIGURE_ARGS := \\
          \t-DALSOFT_REQUIRE_OPENSL=ON \\
          \t-DALSOFT_EXAMPLES=OFF \\
          \t-DALSOFT_UTILS=OFF
          """

          new = """OPENAL_CONFIGURE_ARGS := \\
          \t-DALSOFT_REQUIRE_OPENSL=ON \\
          \t-DALSOFT_BACKEND_OPENSL=ON \\
          \t-DALSOFT_EXAMPLES=OFF \\
          \t-DALSOFT_UTILS=OFF
          """

          if old in s:
              s = s.replace(old, new, 1)

          old_pixman = (
              "./configure $(CONFIGURE_ARGS) "
              "--enable-static --disable-shared --with-pic"
          )

          new_pixman = (
              "./configure $(CONFIGURE_ARGS) "
              "--enable-static --disable-shared --with-pic "
              "--disable-arm-a64-neon"
          )

          if old_pixman in s:
              s = s.replace(old_pixman, new_pixman, 1)

          old_ruby_install = (
              "cd ruby; make -j$(NPROC); make install"
          )

          new_ruby_install = (
              "cd ruby; make -j$(NPROC); "
              "make install-nodoc "
              "INSTRUBY_OPTS=\"--exclude=default-gems "
              "--exclude=bundled-gems\""
          )

          if old_ruby_install in s:
              s = s.replace(old_ruby_install, new_ruby_install, 1)

          old_openssl = (
              '\tcd openssl; '
              'CFLAGS="-Wno-macro-redefined" '
              './Configure $(OPENSSL_TARGET) \\\n'
          )

          new_openssl = (
              '\tcd openssl; '
              'PATH="$(TOOLCHAIN)/bin:$$PATH" '
              'ANDROID_NDK_ROOT="$(NDK)" '
              'ANDROID_NDK_HOME="$(NDK)" '
              'CFLAGS="-Wno-macro-redefined" '
              './Configure $(OPENSSL_TARGET) \\\n'
          )

          if old_openssl in s:
              s = s.replace(old_openssl, new_openssl, 1)

          p.write_text(s)
          PY

      - name: Build modern native dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail

          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export NPROC="$(nproc)"

          : > "$GITHUB_WORKSPACE/native-modern.log"

          for target in cpufeatures pixman iconv openal openssl ruby; do
            echo "========== KERBERUS: building $target ==========" \
              | tee -a "$GITHUB_WORKSPACE/native-modern.log"

            HOST=aarch64-linux-android \
            TARGET=aarch64-linux-android \
            ABI=arm64-v8a \
            make -j1 "$target" 2>&1 \
              | tee -a "$GITHUB_WORKSPACE/native-modern.log"
          done

          test -s build-arm64-v8a/lib/libpixman-1.a
          test -s build-arm64-v8a/lib/libiconv.a
          test -s build-arm64-v8a/lib/libopenal.so
          test -s build-arm64-v8a/lib/libssl.a
          test -s build-arm64-v8a/lib/libcrypto.a
          test -s build-arm64-v8a/lib/libruby.so.3.1.0

      - name: Build and stage Ruby 1.8 legacy runtime
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni
        run: |
          set -euo pipefail

          PIN_RUBY18="50783b870e31259ed5c91badbd5c8e41f8e56273"
          R18="$PWD/ruby18-src"
          OUT="$PWD/build-arm64-v8a/ruby18"

          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          CC="$TC/bin/aarch64-linux-android${ANDROID_API}-clang"
          AR="$TC/bin/llvm-ar"
          RANLIB="$TC/bin/llvm-ranlib"
          NM="$TC/bin/llvm-nm"

          rm -rf "$R18"

          git clone -q -b ruby_1_8 \
            https://github.com/joiplay/ruby "$R18"
          git -C "$R18" checkout -q "$PIN_RUBY18"

          for name in config.guess config.sub; do
            aux="$(find /usr/share -type f -name "$name" \
              2>/dev/null | head -1 || true)"

            if [ -n "$aux" ]; then
              cp -f "$aux" "$R18/$name"
            fi
          done

          sed -i 's/=>TRUE/=>true/g' "$R18/mkconfig.rb" || true

          python3 - "$R18/ruby.c" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()

          old = """#ifndef CharNext\t\t/* defined as CharNext[AW] on Windows. */
          #define CharNext(p) ((p) + mblen(p, RUBY_MBCHAR_MAXSIZE))
          #endif"""

          new = """#if defined(__ANDROID__)
          #include <wchar.h>

          static int kerberus_android_mblen(const char *s, size_t n)
          {
              mbstate_t state = {0};
              size_t result = mbrlen(s, n, &state);

              if (result == (size_t)-1 || result == (size_t)-2) {
                  return -1;
              }

              if (result == 0) {
                  return 0;
              }

              return (int)result;
          }

          #define KERBERUS_MBLEN(s, n) \
              kerberus_android_mblen((s), (n))
          #define CharNext(p) \
              ((p) + KERBERUS_MBLEN((p), RUBY_MBCHAR_MAXSIZE))
          #else
          #ifndef CharNext
          #define CharNext(p) ((p) + mblen(p, RUBY_MBCHAR_MAXSIZE))
          #endif
          #endif"""

          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif "KERBERUS_MBLEN" not in source:
              raise SystemExit("CharNext macro not found in ruby.c")
          PY

          cd "$R18"
          autoconf

          RES="$("$CC" -print-resource-dir)"
          SYSROOT="$TC/sysroot"

          # FIX: include the Ruby source root so missing/memcmp.c
          # can resolve missing.h.
          R18INC="-I$R18 \
          -nostdinc \
          -isystem $RES/include \
          -isystem $SYSROOT/usr/include/aarch64-linux-android \
          -isystem $SYSROOT/usr/include"

          R18CFLAGS="-std=gnu89 \
          -O2 \
          -fno-stack-protector \
          -fno-strict-aliasing \
          -fwrapv \
          -Wno-implicit-function-declaration \
          -Wno-implicit-int \
          -Wno-incompatible-pointer-types \
          -Wno-int-conversion \
          -Wno-deprecated-non-prototype \
          -Wno-unused-value"

          export RUBYOPT="--disable-gems"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          NM="$NM" \
          RUBY="ruby --disable-gems" \
          BASERUBY="ruby --disable-gems" \
          CFLAGS="$R18CFLAGS" \
          CPPFLAGS="$R18INC" \
          LDFLAGS="--sysroot=$SYSROOT \
          -Wl,-z,max-page-size=16384 -ldl -lm -lz" \
          ./configure \
            --host=aarch64-linux-android \
            --build=x86_64-pc-linux-gnu \
            --disable-shared \
            --with-static-linked-ext \
            ac_cv_func_fork=no \
            ac_cv_header_pwd_h=no \
            ac_cv_header_langinfo_h=no

          cat > "$R18/kerberus-host-ruby" <<'EOF'
          #!/usr/bin/env bash
          exec ruby --disable-gems "$@"
          EOF

          chmod +x "$R18/kerberus-host-ruby"

          "$R18/kerberus-host-ruby" -v

          "$R18/kerberus-host-ruby" -e '
            abort "RubyGems foi carregado inesperadamente" if defined?(Gem)
            puts "RubyGems desabilitado: OK"
          '

          make -j1 fake

          FAKE_RB="$(find "$R18" -maxdepth 1 \
            -type f -name '*-fake.rb' -print -quit || true)"

          if [ -z "$FAKE_RB" ]; then
            echo "ERRO: o target fake não gerou o helper *-fake.rb"
            find "$R18" -maxdepth 2 -type f -iname '*fake*' -print || true
            grep -n -A8 -B3 '^fake:' Makefile || true
            exit 1
          fi

          FAKE_MOD="$(basename "$FAKE_RB" .rb)"

          set +e
          "$R18/kerberus-host-ruby" \
            -I"$R18" \
            -r"$FAKE_MOD" \
            -e 'puts "Fake helper carregado: RUBY_VERSION=#{RUBY_VERSION}"'
          FAKE_RC=$?
          set -e

          if [ "$FAKE_RC" -ne 0 ]; then
            echo "Aviso: fake helper não pôde ser carregado."
          fi

          HOST_RUBY="$R18/kerberus-host-ruby"

          : > "$GITHUB_WORKSPACE/ruby18.log"

          set +e

          make -j1 \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            NM="$NM" \
            RUBY="$HOST_RUBY" \
            BASERUBY="$HOST_RUBY" \
            MINIRUBY="$HOST_RUBY" \
            CFLAGS="$R18CFLAGS" \
            CPPFLAGS="$R18INC" \
            LDFLAGS="--sysroot=$SYSROOT \
            -Wl,-z,max-page-size=16384 -ldl -lm -lz" \
            libruby-static.a \
            2>&1 | tee "$GITHUB_WORKSPACE/ruby18.log"

          MAKE_RC=${PIPESTATUS[0]}

          set -e

          if [ "$MAKE_RC" -ne 0 ]; then
            echo "ERRO: compilação do Ruby 1.8 falhou com código $MAKE_RC"
            tail -n 160 "$GITHUB_WORKSPACE/ruby18.log" || true
            exit "$MAKE_RC"
          fi

          test -s libruby-static.a || {
            echo "ERRO: libruby-static.a não foi gerado"
            exit 1
          }

          rm -rf "$OUT"
          mkdir -p "$OUT/lib" "$OUT/include" "$OUT/obj"

          cp -f libruby-static.a "$OUT/lib/libruby18-static.a"

          find . \
            -maxdepth 1 \
            -type f \
            -name '*.h' \
            -exec cp -f {} "$OUT/include/" \;

          for spec in \
            "zlib:zlib.c" \
            "stringio:stringio.c" \
            "strscan:strscan.c"; do

            dir="${spec%%:*}"
            file="${spec#*:}"

            "$CC" \
              $R18CFLAGS \
              -I"$R18" \
              -I"$OUT/include" \
              -DOS_CODE=OS_UNIX \
              -c "$R18/ext/$dir/$file" \
              -o "$OUT/obj/$dir.o"
          done

          "$AR" rcs \
            "$OUT/lib/libruby18-ext.a" \
            "$OUT/obj/"*.o

          "$RANLIB" "$OUT/lib/libruby18-static.a"
          "$RANLIB" "$OUT/lib/libruby18-ext.a"

          "$NM" "$OUT/lib/libruby18-static.a" | grep -q ' ruby_init$'
          "$NM" "$OUT/lib/libruby18-ext.a" | grep -q ' Init_zlib$'

          echo "Ruby 1.8 compilado com sucesso."

      - name: Generate mkxp-z embedded assets
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/app/jni/mkxp-z
        run: |
          set -euo pipefail
          chmod +x make_xxd.sh
          ./make_xxd.sh
          touch binding/binding-mri.cpp binding/binding-util.h

      - name: Configure Gradle Android paths
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK_HOME
          EOF
          chmod +x gradlew

      - name: Build Kerberus XP debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Collect and audit APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -iname '*debug*.apk' | sort | head -1)"

          test -f "$APK"

          OUT="$GITHUB_WORKSPACE/Kerberus-XP-6.1.2-arm64-debug.apk"
          cp -f "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

          AUDIT="$GITHUB_WORKSPACE/_audit"
          rm -rf "$AUDIT"
          mkdir -p "$AUDIT"

          unzip -qq "$OUT" 'lib/arm64-v8a/*.so' -d "$AUDIT"

          for lib in \
            libmkxp-z18.so \
            libmkxp-z31.so \
            libruby.so \
            libopenal.so; do

            test -s "$AUDIT/lib/arm64-v8a/$lib" || {
              echo "ERRO: $lib ausente na APK"
              exit 1
            }
          done

      - name: Upload Kerberus APK
        uses: actions/upload-artifact@v4
        with:
          name: Kerberus-XP-6.1.2-arm64-debug
          path: |
            Kerberus-XP-6.1.2-arm64-debug.apk
            Kerberus-XP-6.1.2-arm64-debug.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kerberus-XP-6.1.2-build-logs
          path: |
            native-modern.log
            ruby18.log
            gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
