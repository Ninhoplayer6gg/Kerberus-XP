name: Kerberus XP Android Bootstrap
on: workflow_dispatch:
permissions: contents: read
jobs: build: name: Build Kerberus XP APK runs-on: ubuntu-22.04 timeout-minutes: 120
env: ANDROID_NDK_VERSION: 23.2.8568313 RUBY_VERSION: "3.1" UPSTREAM_COMMIT: b668e08cb58edf661d56fd4d396036ac31cd8332
steps: - name: Checkout repository uses: actions/checkout@v4
- name: Set up JDK 17 uses: actions/setup-java@v4 with: distribution: temurin java-version: "17"
- name: Run Host Tests (Archive Core) run: bash tests/run_host_tests.sh
- name: Prepare Workspace (Overlay & Patch) run: python3 scripts/prepare_kerberus_mkxpz.py
# O restante do build (NDK, Gradle, etc.) pode ser adicionado # nas etapas seguintes a partir do diretório ./worktree gerado.
