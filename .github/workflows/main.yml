name: Kerberus XP Android Alpha 2 Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kerberus XP APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_NDK_VERSION: 23.2.8568313
      UPSTREAM_COMMIT: b668e08cb58edf661d56fd4d396036ac31cd8332

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake curl git unzip xxd \
            autoconf automake libtool pkg-config

      - name: Set up Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Verify writable Ruby environment
        shell: bash
        run: |
          set -euo pipefail
          ruby -v
          which ruby
          GEM_DEFAULT_DIR="$(ruby -rrubygems -e 'print Gem.default_dir')"
          echo "Gem.default_dir=$GEM_DEFAULT_DIR"
          case "$GEM_DEFAULT_DIR" in
            /var/lib/*|/usr/lib/*)
              echo "Ruby gem directory is not writable: $GEM_DEFAULT_DIR" >&2
              exit 1
              ;;
          esac

      - name: Use preinstalled Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK_HOME="$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          test -d "$NDK_HOME"

          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

          "$SDKMANAGER" --list_installed | grep -E "platforms;android-33|build-tools;33.0.2|ndk;${ANDROID_NDK_VERSION}"

      - name: Fetch pinned mkxp-z Android
        run: |
          git clone --recursive https://github.com/BookerRues9/mkxp-z-android-reworked.git mkxp-android
          git -C mkxp-android checkout "$UPSTREAM_COMMIT"
          git -C mkxp-android submodule update --init --recursive
          test "$(git -C mkxp-android rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply Kerberus XP branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("mkxp-android/app/build.gradle")
          text = gradle.read_text(encoding="utf-8")
          text = text.replace('applicationId "com.hatkid.mkxpz"', 'applicationId "com.kerberus.xp"')
          text = re.sub(r'versionCode\s+\d+', 'versionCode 1000', text)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "0.0.1-alpha"', text)
          text = text.replace('archivesBaseName = "mkxp-z-$versionName"', 'archivesBaseName = "Kerberus-XP-$versionName"')
          gradle.write_text(text, encoding="utf-8")

          strings = Path("mkxp-android/app/src/main/res/values/strings.xml")
          if strings.exists():
              s = strings.read_text(encoding="utf-8")
              s = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Kerberus XP</string>', s)
              strings.write_text(s, encoding="utf-8")
          PY

      - name: Download JNI dependencies
        working-directory: mkxp-android/app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh

      - name: Generate XXD sources
        working-directory: mkxp-android/app/jni/mkxp-z
        run: |
          chmod +x make_xxd.sh
          ./make_xxd.sh

      - name: Compile native dependencies arm64-v8a
        working-directory: mkxp-android/app/jni
        env:
          ARCH: linux-x86_64
        run: |
          set -euo pipefail
          HOST=aarch64-linux-android \
          TARGET=aarch64-linux-android \
          ABI=arm64-v8a \
          LDFLAGS="-Wl,-z,max-page-size=16384" \
          make -j"$(nproc)"

          # The upstream Android workflow expects this compatibility mapping
          # before Gradle/ndkBuild starts.
          if [ -d "build-arm64-v8a" ] && [ ! -e "build-arm64" ]; then
            ln -s build-arm64-v8a build-arm64
          fi

          echo "Native build directories:"
          ls -ld build-arm64* || true

      - name: Add Kerberus boot diagnostics
        shell: bash
        run: |
          set -euo pipefail
          FILE="mkxp-android/app/jni/mkxp-z/binding/binding-mri.cpp"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("mkxp-android/app/jni/mkxp-z/binding/binding-mri.cpp")
          s = p.read_text()

          if '#include <fstream>' not in s:
              s = s.replace('#include <string>\n', '#include <string>\n#include <fstream>\n', 1)

          marker = 'static void mriBindingExecute();\n'
          helper = (
              'static void kerberusBootLog(const std::string &msg)\n'
              '{\n'
              '    std::ofstream f("kerberus_boot.log", std::ios::app);\n'
              '    if (f)\n'
              '    {\n'
              '        f << msg << std::endl;\n'
              '        f.flush();\n'
              '    }\n'
              '}\n\n'
          )
          if 'static void kerberusBootLog(' not in s:
              s = s.replace(marker, helper + marker, 1)

          old_show = (
              'static void showMsg(const std::string &msg)\n'
              '{\n'
              '\tshState->eThread().showMessageBox(msg.c_str());\n'
              '}'
          )
          new_show = (
              'static void showMsg(const std::string &msg)\n'
              '{\n'
              '    kerberusBootLog(std::string("MESSAGE: ") + msg);\n'
              '\tshState->eThread().showMessageBox(msg.c_str());\n'
              '}'
          )
          if old_show in s:
              s = s.replace(old_show, new_show, 1)

          sig = 'static void mriBindingExecute() {'
          if sig in s and 'KERBERUS: mriBindingExecute begin' not in s:
              s = s.replace(
                  sig,
                  sig + '\n    kerberusBootLog("KERBERUS: mriBindingExecute begin");',
                  1
              )

          sig2 = 'static void runRMXPScripts(BacktraceData &btData) {'
          if sig2 in s and 'KERBERUS: runRMXPScripts begin' not in s:
              s = s.replace(
                  sig2,
                  sig2 + '\n    kerberusBootLog("KERBERUS: runRMXPScripts begin");',
                  1
              )

          load_call = 'scriptArray = kernelLoadDataInt(scriptPack.c_str(), false, false);'
          if load_call in s and 'KERBERUS: loading script pack' not in s:
              s = s.replace(
                  load_call,
                  'kerberusBootLog(std::string("KERBERUS: loading script pack: ") + scriptPack);\n'
                  '        ' + load_call + '\n'
                  '        kerberusBootLog("KERBERUS: script pack loaded");',
                  1
              )

          eval_sig = 'static VALUE evalHelper(evalArg *arg) {'
          if eval_sig in s and 'KERBERUS: EVAL ' not in s:
              s = s.replace(
                  eval_sig,
                  eval_sig
                  + '\n    if (RB_TYPE_P(arg->filename, RUBY_T_STRING))\n'
                  + '        kerberusBootLog(std::string("KERBERUS: EVAL ") + RSTRING_PTR(arg->filename));',
                  1
              )

          p.write_text(s)
          PY

          grep -n "KERBERUS:" "$FILE"
          grep -n "kerberusBootLog" "$FILE" | head -n 20

      - name: Force ARM64-only APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="mkxp-android/app/build.gradle"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("mkxp-android/app/build.gradle")
          s = p.read_text()

          # Limit ABI splits to ARM64 only.
          s = re.sub(
              r"include\s+'arm64-v8a'\s*,\s*'armeabi-v7a'",
              "include 'arm64-v8a'",
              s
          )

          # Add a defensive ndk abiFilter inside defaultConfig if one is not already present.
          if "abiFilters 'arm64-v8a'" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        ndk { abiFilters 'arm64-v8a' }",
                  1
              )

          p.write_text(s)
          PY

          echo "Patched ABI configuration:"
          grep -nE "abiFilters|include 'arm64-v8a'|armeabi-v7a" "$GRADLE_FILE" || true

      - name: Build signed Debug APK
        working-directory: mkxp-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Pandroid.suppressUnsupportedCompileSdk=34 \
            --no-daemon \
            --stacktrace

      - name: Collect signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APK="$(find mkxp-android/app/build/outputs/apk/debug -type f \
            \( -name '*arm64-v8a*debug*.apk' -o -name '*debug*.apk' \) \
            | head -n 1)"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Signed debug APK not found." >&2
            find mkxp-android/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          cp "$APK" dist/Kerberus-XP-Alpha2-Diagnostic-arm64-signed.apk
          sha256sum dist/Kerberus-XP-Alpha2-Diagnostic-arm64-signed.apk \
            > dist/Kerberus-XP-Alpha2-Diagnostic-arm64-signed.apk.sha256

          # Verify Android APK signature.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose dist/Kerberus-XP-Alpha2-Diagnostic-arm64-signed.apk

          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kerberus-XP-Alpha0
          path: |
            dist/Kerberus-XP-Alpha2-Diagnostic-arm64-signed.apk
            dist/Kerberus-XP-Alpha2-Diagnostic-arm64-signed.apk.sha256
          if-no-files-found: error
          retention-days: 14
          
