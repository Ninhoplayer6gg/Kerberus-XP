name: Kerberus XP Android Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kerberus XP APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_NDK_VERSION: 23.2.8568313
      RUBY_VERSION: "3.1"
      UPSTREAM_COMMIT: b668e08cb58edf661d56fd4d396036ac31cd8332

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Materialize Kerberus source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p $(dirname 'scripts/prepare_kerberus_mkxpz.py')
          printf '%s' '' | base64 -d > 'scripts/prepare_kerberus_mkxpz.py'
          mkdir -p $(dirname 'tests/run_host_tests.sh')
          printf '%s' '' | base64 -d > 'tests/run_host_tests.sh'
          mkdir -p $(dirname 'tests/ProjectArchiveCoreHostTest.java')
          printf '%s' '' | base64 -d > 'tests/ProjectArchiveCoreHostTest.java'
          mkdir -p $(dirname 'kerberus-overlay/app/src/main/AndroidManifest.xml')
          printf '%s' '' | base64 -d > 'kerberus-overlay/app/src/main/AndroidManifest.xml'
          mkdir -p $(dirname 'kerberus-overlay/app/src/main/res/values/strings.xml')
          printf '%s' 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPktlcmJlcnVzIFhQPC9zdHJpbmc+CjwvcmVzb3VyY2VzPgo=' | base64 -d > 'kerberus-overlay/app/src/main/res/values/strings.xml'
          mkdir -p $(dirname 'kerberus-overlay/app/src/main/java/com/kerberus/launcher/KerberusLauncherActivity.java')
          printf '%s' '
